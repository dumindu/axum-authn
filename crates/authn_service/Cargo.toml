[package]
name = "authn_service"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[[bin]]
name = "apidoc"
path = "src/bin/apidoc.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
envconfig = "0.11.1"
garde = "0.23.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
toasty = { version = "0.9.0", features = ["postgresql", "migration", "jiff", "serde"] }
toasty-cli = "0.9.0"
tokio = "1.53.1"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "jiff_0_2", "uuid", "yaml"] }
